name: Windows MVP
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install --only-binary=:all: -r windows/requirements.txt
      - run: python -m unittest discover -s windows/tests -v
      - run: python -m compileall -q windows
